<!DOCTYPE html>
<html lang="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funny Legends</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff3a;
            color: #333;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        h1 {
            color: #2c3e50;
            font-size: 2.5em;
            margin-bottom: 5px;
        }

        .intro-text {
            color: #666;
            margin-bottom: 40px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            max-width: 500px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .artwork {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            transition: transform 0.3s ease;
        }

        .artwork:hover {
            transform: scale(1.01);
        }

        .artwork img {
            width: 100%;
            height: auto;
            border-radius: 8px;
        }

        .artwork-title {
            margin: 15px 0 5px 0;
            font-size: 1.2em;
            font-weight: bold;
        }

        .artwork-date {
            font-size: 0.9em;
            color: #888;
            margin: 0;
            margin-bottom: 15px;
        }

        .reactions {
            display: flex;
            justify-content: center;
            /* Litt mer luft mellom knappene nå som de ikke har bakgrunn */
            gap: 20px; 
            margin-top: 5px;
        }

        .reaction-btn {
            /* ENDRET: Fjernet bakgrunn, ramme og avrunding */
            background: transparent;
            border: none;
            border-radius: 0;
            
            /* ENDRET: Mindre padding, mest for å gi litt rom rundt ikonet */
            padding: 5px;
            
            /* Litt større ikoner som standard */
            font-size: 1em; 
            cursor: pointer;
            
            /* Myk overgang for forstørrelsen */
            transition: all 0.2s ease-in-out; 
            display: flex;
            align-items: center;
            gap: 8px;
            
            /* Default farge på tallet */
            color: #777; 
        }

        .reaction-btn span {
            font-weight: 500;
        }

        /* ENDRET: Hover-effekt er nå subtil forstørrelse */
        .reaction-btn:hover {
            background: transparent; /* Sikrer ingen bakgrunn */
            transform: scale(1.15); /* Forstørrer ikonet litt */
        }

        /* ENDRET: Stiler når brukeren har trykket (subtilt, uten pill-farge) */
        .active-heart,
        .active-thumb {
            background: transparent !important; /* Ingen bakgrunnsfarge */
            border: none !important; /* Ingen kantlinje */
            transform: scale(1.05); /* Litt større permanent */
            color: #333 !important; /* Mørkere tall */
        }
        
        /* Gjør tallene litt feitere når valgt */
        .active-heart span,
        .active-thumb span {
            font-weight: 700;
        }


        .main-footer {
            margin-top: 50px;
            padding: 20px;
            border-top: 1px solid #eee;
            font-size: 0.9em;
            color: #888;
        }

        .footer-content {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .footer-nav a {
            color: #666;
            text-decoration: none;
            margin: 0 10px;
            transition: color 0.2s;
        }

        .footer-nav a:hover {
            color: #2c3e50;
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <h1>🎨 Funny Legends 🎨</h1>
    <p class="intro-text">My collection of funny legends</p>

    <div class="gallery" id="kunst-galleri"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDHI0z10pfh0mDOjNeqBud07QXdIgy0cM4",
            databaseURL: "https://funny-legends-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "funny-legends",
            appId: "1:997341264073:web:499b58763a9d8f98cdb518"
        };


        // Initialiser Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        // Funksjon for å stemme (Global funksjon lagt til window så HTML kan nå den)
        window.vote = async function (id, type) {
            // 1. Hent myVotes fra localStorage FØRST
            const myVotes = JSON.parse(localStorage.getItem('myVotes') || '{}');

            // 2. Sjekk om bildet allerede har en registrert stemme
            if (myVotes[id]) {
                console.log("Du har allerede stemt på dette bildet.");
                return; // Avbryter funksjonen her
            }

            const voteRef = ref(db, `likes/${id}/${type}`);

            try {
                // Venter på at Firebase bekrefter lagringen før vi går videre
                await runTransaction(voteRef, (currentCount) => {
                    return (currentCount || 0) + 1;
                });

                // FØRST når Firebase har godkjent, lagrer vi lokalt at du har stemt
                myVotes[id] = type;
                localStorage.setItem('myVotes', JSON.stringify(myVotes));
                oppdaterKnappeStil(id, type);
                
            } catch (error) {
                // Hvis Firebase avviser (f.eks. pga. sikkerhetsregler), vises feilen her
                console.error("Transaksjonen feilet:", error);
            }
        };

        function oppdaterKnappeStil(id, type) {
            const btn = document.getElementById(`${type}-${id}`);
            if (btn) btn.classList.add(type === 'heart' ? 'active-heart' : 'active-thumb');
        }



        async function lastInnGalleri() {
            try {
                const response = await fetch('tegninger.json');
                const tegninger = await response.json();
                const galleriContainer = document.getElementById('kunst-galleri');
                const myVotes = JSON.parse(localStorage.getItem('myVotes') || '{}');



                tegninger.forEach((kunst) => {
                    // Lager en unik ID basert på filnavnet (fjerner punktum og spesialtegn for Firebase)
                    const id = kunst.filnavn.replace(/[^a-zA-Z0-9]/g, "");


                    const html = `
                        <div class="artwork">
                            <img src="${kunst.filnavn}" alt="${kunst.tittel}">
                            <p class="artwork-title">${kunst.tittel}</p>
                            <p class="artwork-date">${kunst.dato}</p>
                            
                            <div class="reactions">
                                <button id="heart-${id}" class="reaction-btn ${myVotes[id] === 'heart' ? 'active-heart' : ''}" onclick="vote('${id}', 'heart')">
                                    ❤️ <span id="count-heart-${id}">0</span>
                                </button>
                                <button id="thumb-${id}" class="reaction-btn ${myVotes[id] === 'thumb' ? 'active-thumb' : ''}" onclick="vote('${id}', 'thumb')">
                                    👍 <span id="count-thumb-${id}">0</span>
                                </button>
                            </div>
                        </div>
                    `;
                    galleriContainer.innerHTML += html;

                    // Lytt på sanntidsendringer for hvert bilde
                    const countsRef = ref(db, `likes/${id}`);
                    onValue(countsRef, (snapshot) => {
                        const data = snapshot.val();
                        if (data) {
                            const heartSpan = document.getElementById(`count-heart-${id}`);
                            const thumbSpan = document.getElementById(`count-thumb-${id}`);
                            if(heartSpan) heartSpan.innerText = data.heart || 0;
                            if(thumbSpan) thumbSpan.innerText = data.thumb || 0;
                        }
                    });
                });
            } catch (error) {
                console.error("Feil:", error);
                document.getElementById('kunst-galleri').innerHTML = "<p>Kunne ikke laste galleriet.</p>";
            }
        }

        lastInnGalleri();
    </script>

<footer class="main-footer">
    <div class="footer-content">
        <p>&copy; 2026 Funny Legends</p>
        <div class="footer-nav">
            <a href="personvern.html">Personvern</a>
        </div>
    </div>
</footer>
</body>

</html>
