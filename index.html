<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sønnens Kunstgalleri</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        h1 { color: #2c3e50; font-size: 2.5em; margin-bottom: 5px; }
        .intro-text { color: #666; margin-bottom: 40px; }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .artwork {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            transition: transform 0.3s ease;
        }

        .artwork:hover { transform: translateY(-5px); }

        .artwork img {
            width: 100%;
            height: auto;
            border-radius: 8px;
        }

        .artwork-title { margin: 15px 0 5px 0; font-size: 1.2em; font-weight: bold; }
        .artwork-date { font-size: 0.9em; color: #888; margin: 0; }
    </style>
</head>
<body>

    <h1>🎨 Kunstgalleriet 🎨</h1>
    <p class="intro-text">En dynamisk samling av mesterverk</p>

    <div class="gallery" id="kunst-galleri"></div>

    <script>
        // Funksjon som henter data fra JSON-filen
        async function lastInnGalleri() {
            try {
                const response = await fetch('tegninger.json');
                const tegninger = await response.json();
                const galleriContainer = document.getElementById('kunst-galleri');

                // Gå gjennom hver tegning i JSON-filen og lag HTML
                tegninger.forEach(kunst => {
                    const html = `
                        <div class="artwork">
                            <img src="${kunst.filnavn}" alt="${kunst.tittel}">
                            <p class="artwork-title">${kunst.tittel}</p>
                            <p class="artwork-date">${kunst.dato}</p>
                        </div>
                    `;
                    galleriContainer.innerHTML += html;
                });
            } catch (error) {
                console.error("Kunne ikke laste inn tegninger:", error);
                document.getElementById('kunst-galleri').innerHTML = "<p>Beklager, kunne ikke laste inn bildene akkurat nå.</p>";
            }
        }

        // Start hentingen når siden åpnes
        lastInnGalleri();
    </script>

</body>
</html>
